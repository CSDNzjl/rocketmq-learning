# ============================================================
# Spring Boot 配置文件（YAML 格式）
# 作用：端口、MQ 地址、Topic、Stream binding、阶段6 Tag 订阅
# ============================================================

server:
  port: 8088

spring:
  application:
    name: rocketmq-springboot-demo

  # ============================================================
  # 【阶段4～6】Spring Cloud Stream（对齐 fom-daq 的 daqCollect-out-0 / in-0）
  #
  # 名词：
  #   binding 名 = 应用侧「插头」：demoCollect-out-0 / demoCollect-in-0
  #   destination = 真正的 Topic：demo-topic
  #   group       = 消费组（仅 in）：demo-stream-consumer-group
  #
  # 阶段5：同一 binding 上 JSON + 业务内按 type 分发 Handler
  # 阶段6：发送时打 RocketMQ Tag；入站用 subscription 只订部分 Tag
  #         （Broker 侧提前过滤，未订到的消息根本进不了本应用）
  # ============================================================
  cloud:
    function:
      definition: demoCollect
    stream:
      bindings:
        demoCollect-out-0:
          destination: demo-topic
          content-type: text/plain
        demoCollect-in-0:
          destination: demo-topic
          content-type: text/plain
          # 必须用【自己的】消费组；不要和阶段1～3 的 demo-consumer-group 混用
          group: demo-stream-consumer-group
      rocketmq:
        binder:
          name-server: 192.168.103.143:30094
        # 【阶段6】按 binding 配置消费者订阅表达式（Tag 或 SQL）
        # subscription 写法：
        #   TEMP              → 只收 Tag=TEMP
        #   TEMP||PRESSURE    → 收两类（|| 分隔）
        #   *                 → 收全部 Tag（等同不过滤）
        # 下面用 ${demo.stream.subscription-tags}，改 demo 段即可切换，不必改两处
        bindings:
          demoCollect-in-0:
            consumer:
              subscription: ${demo.stream.subscription-tags}

rocketmq:
  name-server: 192.168.103.143:30094
  producer:
    group: demo-producer-group
    send-message-timeout: 3000
    vip-channel-enabled: false

demo:
  topic: demo-topic
  consumer-group: demo-consumer-group
  route:
    my-module: smelt
  stream:
    binding-out: demoCollect-out-0
    # 【阶段6】入站只订这些 Tag（默认 TEMP，用来证明 PRESSURE 发得出但收不到）
    # 想恢复阶段5「全收」：改成 * 后重启
    # 想两类都收：改成 TEMP||PRESSURE 后重启
    subscription-tags: TEMP

logging:
  level:
    com.example.rocketmqdemo: INFO
    org.apache.rocketmq.spring: INFO
    org.apache.rocketmq.client: WARN
    org.springframework.cloud.stream: INFO

# ============================================================
# 【阶段 XXL-JOB】执行器配置（本 Demo 变成可被 Admin 调度的执行器）
#
# 小白对照：
#   admin.addresses  = 调度中心网页地址（浏览器也能打开登录）
#   accessToken      = 通讯口令，必须和 Admin 里配置的一致，否则注册/回调失败
#   executor.appname = 执行器名字；Admin「执行器管理」新建时填同一个
#   executor.port    = 本机监听端口，Admin 回调用；9998（勿用被占用的 9999）
#   logpath          = 任务运行日志目录（相对项目运行目录）
#
# Admin 登录（远程）：http://192.168.103.143:30020/xxl-job-admin/
#   账号 admin / 密码 123456
# ============================================================
xxl:
  job:
    accessToken: '432e62f3b488bc861d91b0e274e850cc'
    admin:
      addresses: http://192.168.103.143:30020/xxl-job-admin/
    executor:
      appname: rocketmq-springboot-demo
      address: ''
      ip: ''
      port: 9998
      logpath: ./logs/xxl-job
      logretentiondays: 30
